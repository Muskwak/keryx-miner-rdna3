name: Tests

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

# RDNA3 / Vulkan fork: no CUDA/nvcc, no OpenCL. The build needs `protoc` and a recent `glslc`
# (keryx-vulkan/build.rs compiles the GLSL compute shaders to SPIR-V at build time). The GPU
# bit-exactness tests in keryx-vulkan skip gracefully when no Vulkan device is present (CI runners
# have no GPU), so the suite still validates compilation + the CPU paths.

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Vulkan SDK (glslc)
        uses: ./.github/actions/vulkan-sdk
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --tests

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Fix CRLF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Vulkan SDK (glslc)
        uses: ./.github/actions/vulkan-sdk
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (workspace, release)
        run: cargo test --workspace --release
      - name: cargo test (no-asm)
        run: cargo test -p keryx-miner --release --features no-asm
      - name: cargo test (no default features)
        run: cargo test -p keryx-miner --release --no-default-features

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Protoc
        uses: rustfs/setup-protoc@v3.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Vulkan SDK (glslc)
        uses: ./.github/actions/vulkan-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # NOTE: `cargo fmt --check` is intentionally not gated — this fork keeps hand-aligned
      # formatting (shader/push-constant comment tables, wide CLI help) that rustfmt would mangle.
      - name: cargo clippy
        run: cargo clippy --workspace --tests

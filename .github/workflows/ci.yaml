name: Tests

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

# RDNA3 / Vulkan fork: no CUDA/nvcc, no OpenCL. The build needs `protoc` and the Vulkan SDK's
# `glslc` (keryx-vulkan/build.rs compiles the GLSL compute shaders to SPIR-V at build time). The
# GPU bit-exactness tests in keryx-vulkan skip gracefully when no Vulkan device is present (CI
# runners have no GPU), so the suite still validates compilation + the CPU paths.

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Vulkan SDK (glslc)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc || {
            wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-$(lsb_release -cs).list https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list
            sudo apt-get update
            sudo apt-get install -y vulkan-sdk
          }
          glslc --version

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --tests

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Fix CRLF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Vulkan SDK (glslc) — Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc || {
            wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-$(lsb_release -cs).list https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list
            sudo apt-get update
            sudo apt-get install -y vulkan-sdk
          }
          glslc --version

      - name: Install Vulkan SDK (glslc) — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "1.3.296.0"  # bump as needed; LunarG keeps older installers available
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe" -OutFile "$env:RUNNER_TEMP\vulkan.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\vulkan.exe" -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          "VULKAN_SDK=C:\VulkanSDK\$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\$ver\Bin"        | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo test (workspace, release)
        run: cargo test --workspace --release

      - name: cargo test (no-asm)
        run: cargo test -p keryx-miner --release --features no-asm

      - name: cargo test (no default features)
        run: cargo test -p keryx-miner --release --no-default-features

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Vulkan SDK (glslc)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc || {
            wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-$(lsb_release -cs).list https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list
            sudo apt-get update
            sudo apt-get install -y vulkan-sdk
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --tests

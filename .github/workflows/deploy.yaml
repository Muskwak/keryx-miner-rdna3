name: Build and upload assets

on:
  release:
    types: [published]

permissions:
  contents: write

# RDNA3 / Vulkan fork: single self-contained binary (no CUDA/OpenCL plugin .so/.dll). Linux + Windows
# only — the fork targets AMD RDNA3 via Vulkan. Build needs `protoc` + a recent `glslc`.

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Fix CRLF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Install Protoc
        uses: rustfs/setup-protoc@v3.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Vulkan SDK (glslc)
        uses: ./.github/actions/vulkan-sdk

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --bin keryx-miner
          asset="keryx-miner-${{ github.event.release.tag_name }}-linux-amd64"
          mkdir "$asset"
          cp target/release/keryx-miner "$asset/keryx-miner"
          cp README.md "$asset/" 2>/dev/null || true
          strip "$asset/keryx-miner" || true
          tar czvf "$asset.tgz" "$asset"
          echo "ASSET=$asset.tgz" >> "$GITHUB_ENV"

      # HiveOS custom-miner package: the *-hiveos.tgz a flightsheet's "Installation URL"
      # points at. Extracts to /hive/miners/custom/keryx-miner/ on the rig. Linux only.
      - name: Package HiveOS flightsheet (Linux)
        if: runner.os == 'Linux'
        run: |
          tag="${{ github.event.release.tag_name }}"
          pkg="keryx-miner"
          # Regenerate the manifest so CUSTOM_VERSION tracks the release tag.
          ( cd integrations/hiveos && bash createmanifest.sh "${tag#v}" keryx-miner )
          mkdir -p "$pkg"
          cp integrations/hiveos/h-config.sh \
             integrations/hiveos/h-run.sh \
             integrations/hiveos/h-stats.sh \
             integrations/hiveos/h-manifest.conf "$pkg/"
          cp target/release/keryx-miner "$pkg/keryx-miner"
          strip "$pkg/keryx-miner" || true
          chmod +x "$pkg"/*.sh "$pkg/keryx-miner"
          tar czvf "keryx-miner-${tag}-hiveos.tgz" "$pkg"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --bin keryx-miner
          asset="keryx-miner-${{ github.event.release.tag_name }}-win64-amd64"
          mkdir "$asset"
          cp target/release/keryx-miner.exe "$asset/keryx-miner.exe"
          cp start-miner.bat "$asset/" 2>/dev/null || true
          cp README.md "$asset/" 2>/dev/null || true
          7z a -tzip "$asset.zip" "$asset"
          echo "ASSET=$asset.zip" >> "$GITHUB_ENV"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          # env.ASSET is the per-OS binary (literal path, always present). The hiveos
          # line is a glob: it matches on the Linux runner and is harmlessly skipped on
          # Windows where no such file was produced.
          files: |
            ${{ env.ASSET }}
            keryx-miner-*-hiveos.tgz

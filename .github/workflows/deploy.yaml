name: Build and upload assets

on:
  release:
    types: [published]

permissions:
  contents: write

# RDNA3 / Vulkan fork: single self-contained binary (no CUDA/OpenCL plugin .so/.dll). Linux + Windows
# only — the fork targets AMD RDNA3 via Vulkan. Build needs `protoc` + the Vulkan SDK's `glslc`.

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Fix CRLF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Vulkan SDK (glslc) — Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc || {
            wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-$(lsb_release -cs).list https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list
            sudo apt-get update
            sudo apt-get install -y vulkan-sdk
          }
          glslc --version

      - name: Install Vulkan SDK (glslc) — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "1.3.296.0"  # bump as needed; LunarG keeps older installers available
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe" -OutFile "$env:RUNNER_TEMP\vulkan.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\vulkan.exe" -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          "VULKAN_SDK=C:\VulkanSDK\$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\$ver\Bin"        | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --bin keryx-miner
          asset="keryx-miner-${{ github.event.release.tag_name }}-linux-amd64"
          mkdir "$asset"
          cp target/release/keryx-miner "$asset/keryx-miner"
          cp README.md "$asset/" 2>/dev/null || true
          strip "$asset/keryx-miner" || true
          tar czvf "$asset.tgz" "$asset"
          echo "ASSET=$asset.tgz" >> "$GITHUB_ENV"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --bin keryx-miner
          asset="keryx-miner-${{ github.event.release.tag_name }}-win64-amd64"
          mkdir "$asset"
          cp target/release/keryx-miner.exe "$asset/keryx-miner.exe"
          cp start-miner.bat "$asset/" 2>/dev/null || true
          cp README.md "$asset/" 2>/dev/null || true
          7z a -tzip "$asset.zip" "$asset"
          echo "ASSET=$asset.zip" >> "$GITHUB_ENV"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}

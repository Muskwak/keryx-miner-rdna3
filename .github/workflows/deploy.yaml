name: Build and upload assets

on:
  release:
    types: [published]
  # Dry-run without a release: builds everything and uploads workflow artifacts only.
  workflow_dispatch:

permissions:
  contents: write

# RDNA3 / Vulkan fork: self-contained binaries (no CUDA/OpenCL plugin .so/.dll), two variants
# per OS:
#   * standard  — external prebuilt llama-server for OPoI inference (zero C++ toolchain to build)
#   * zero-dup  — in-process llama.cpp (Vulkan): the PoM walk shares the inference engine's
#                 resident weight buffers (single binary, no llama-server; needs cmake + ninja +
#                 libclang + Vulkan SDK at build time)
#
# The Linux jobs run inside an ubuntu:20.04 container: HiveOS worker images are Ubuntu 20.04
# based (glibc 2.31), so anything built on newer runners would fail with "GLIBC_2.3x not found"
# on the rigs. The HiveOS package ships the zero-dup binary — one process, no llama-server child.

jobs:
  build-windows:
    name: Build windows
    runs-on: windows-latest
    env:
      # Fetch git deps with the git CLI (honours core.longpaths for the llama.cpp submodule).
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Short target dir: ggml's nested vulkan-shaders-gen TryCompile paths exceed MAX_PATH
      # under the default deep target/ ("C1083: Cannot open compiler generated file").
      CARGO_TARGET_DIR: D:\ct
    steps:
      - name: Fix CRLF on Windows + long paths (llama.cpp submodule has >260-char paths)
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: rustfs/setup-protoc@v3.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Vulkan SDK (glslc)
        uses: ./.github/actions/vulkan-sdk

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve tag
        shell: bash
        run: echo "TAG=${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}" >> "$GITHUB_ENV"

      - name: Build standard (llama-server variant)
        shell: bash
        run: |
          cargo build --release --bin keryx-miner
          asset="keryx-miner-${TAG}-win64-amd64"
          mkdir "$asset"
          cp "$CARGO_TARGET_DIR"/release/keryx-miner.exe "$asset/"
          cp start-miner.bat README.md "$asset/" 2>/dev/null || true
          7z a -tzip "$asset.zip" "$asset"

      # cl.exe on PATH for the Ninja generator: the VS generator's vulkan-shaders-gen
      # ExternalProject rule breaks (MSB8066); Ninja matches the locally-validated path.
      - name: MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      # pwsh, not bash: under bash, Git's coreutils link.exe shadows MSVC's linker in the
      # vcvars environment and rustc fails with "link.exe returned an unexpected error".
      - name: Build zero-dup (in-process llama.cpp variant)
        shell: pwsh
        env:
          # bindgen needs libclang; LLVM is preinstalled on windows runners.
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CMAKE_GENERATOR: Ninja
        run: |
          cargo build --release --features zero-dup --bin keryx-miner
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $asset = "keryx-miner-$env:TAG-win64-amd64-zerodup"
          New-Item -ItemType Directory $asset | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR/release/keryx-miner.exe" $asset/
          foreach ($f in @('start-miner.bat', 'README.md')) { if (Test-Path $f) { Copy-Item $f $asset/ } }
          7z a -tzip "$asset.zip" $asset
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: keryx-miner-*.zip

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: keryx-miner-*.zip

  build-linux:
    name: Build linux + hiveos
    runs-on: ubuntu-latest
    # glibc 2.31 floor — matches HiveOS 20.04-based worker images.
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install system toolchain
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget gnupg xz-utils unzip git python3 \
            build-essential gcc-10 g++-10 ninja-build pkg-config \
            clang-12 libclang-12-dev libvulkan-dev p7zip-full
          # llama.cpp wants a newer cmake than focal's 3.16 — Kitware maintains a focal repo.
          wget -qO- https://apt.kitware.com/keys/kitware-archive-latest.asc | gpg --dearmor -o /usr/share/keyrings/kitware.gpg
          echo "deb [signed-by=/usr/share/keyrings/kitware.gpg] https://apt.kitware.com/ubuntu/ focal main" > /etc/apt/sources.list.d/kitware.list
          apt-get update && apt-get install -y cmake
      - uses: actions/checkout@v7

      # glslc: LunarG dropped both the focal apt repo and the old SDK tarball downloads, and
      # current SDK binaries need newer glibc than this container — so build glslc from source
      # once (pinned shaderc release; its glslang knows GL_EXT_integer_dot_product /
      # buffer_reference / int64 — everything the keryx + ggml shaders use) and cache the
      # binary. ggml's vulkan-shaders-gen finds it on PATH; keryx-vulkan honours $GLSLC.
      - name: Cache glslc
        id: cache-glslc
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/glslc
          key: glslc-shaderc-v2026.1-focal

      - name: Build glslc from source (cache miss)
        if: steps.cache-glslc.outputs.cache-hit != 'true'
        env:
          CC: gcc-10
          CXX: g++-10
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v2026.1 https://github.com/google/shaderc /tmp/shaderc
          cd /tmp/shaderc
          python3 ./utils/git-sync-deps
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON -DSHADERC_SKIP_COPYRIGHT_CHECK=ON
          cmake --build build --target glslc_exe -j"$(nproc)"
          cp build/glslc/glslc /usr/local/bin/glslc

      - name: Verify glslc
        run: |
          set -euxo pipefail
          echo "GLSLC=/usr/local/bin/glslc" >> "$GITHUB_ENV"
          /usr/local/bin/glslc --version

      - name: Install Protoc
        uses: rustfs/setup-protoc@v3.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve tag
        run: echo "TAG=${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}" >> "$GITHUB_ENV"

      - name: Build standard (llama-server variant)
        run: |
          set -euxo pipefail
          cargo build --release --bin keryx-miner
          asset="keryx-miner-${TAG}-linux-amd64"
          mkdir "$asset"
          cp target/release/keryx-miner "$asset/"
          cp README.md "$asset/" 2>/dev/null || true
          strip "$asset/keryx-miner" || true
          tar czvf "$asset.tgz" "$asset"

      - name: Build zero-dup (in-process llama.cpp variant)
        env:
          LIBCLANG_PATH: /usr/lib/llvm-12/lib
          CC: gcc-10
          CXX: g++-10
          CMAKE_GENERATOR: Ninja
        run: |
          set -euxo pipefail
          cargo build --release --features zero-dup --bin keryx-miner
          asset="keryx-miner-${TAG}-linux-amd64-zerodup"
          mkdir "$asset"
          cp target/release/keryx-miner "$asset/"
          cp README.md "$asset/" 2>/dev/null || true
          strip "$asset/keryx-miner" || true
          tar czvf "$asset.tgz" "$asset"

      # HiveOS custom-miner package: the *-hiveos.tgz a flightsheet's "Installation URL" points
      # at; extracts to /hive/miners/custom/keryx-miner/. Ships the ZERO-DUP binary: a single
      # process (inference in-process, PoM walk over shared weights) — no llama-server child for
      # h-run.sh to manage. Requires libvulkan1 + Vulkan-capable amdgpu on the rig (h-config.sh
      # installs libvulkan1 if missing).
      - name: Package HiveOS flightsheet
        run: |
          set -euxo pipefail
          pkg="keryx-miner"
          ( cd integrations/hiveos && bash createmanifest.sh "${TAG#v}" keryx-miner )
          mkdir -p "$pkg"
          cp integrations/hiveos/h-config.sh \
             integrations/hiveos/h-run.sh \
             integrations/hiveos/h-stats.sh \
             integrations/hiveos/h-manifest.conf "$pkg/"
          cp target/release/keryx-miner "$pkg/keryx-miner"
          strip "$pkg/keryx-miner" || true
          chmod +x "$pkg"/*.sh "$pkg/keryx-miner"
          tar czvf "keryx-miner-${TAG}-hiveos.tgz" "$pkg"

      - name: Upload artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            keryx-miner-*.tgz

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: keryx-miner-*.tgz
